[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelmesh"
version = "0.1.0"
description = "Local defensive network-flow investigation demo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sentinelmesh = "sentinelmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

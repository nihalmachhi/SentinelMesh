[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelmesh"
version = "0.1.0"
description = "Local defensive network-flow investigation demo"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]

[project.scripts]
sentinelmesh = "sentinelmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
ml = ["scikit-learn>=1.5"]
graph = ["networkx>=3.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["TRY004"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sentinelmesh"]

[tool.setuptools.package-data]
"sentinelmesh.web" = ["index.html", "static/*.css", "static/*.js"]

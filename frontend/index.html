<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SentinelMesh | Defensive investigations</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,sans-serif;background:#0b1220;color:#e7eef8;--panel:#121e31;--line:#263952;--muted:#9aabc0;--mint:#73dfbb;--amber:#f4c36a;--red:#fb827c}
*{box-sizing:border-box}body{max-width:1180px;margin:32px auto;padding:0 22px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:0;font-size:30px}h2{margin:28px 0 12px}.muted{color:var(--muted)}.badge{border:1px solid #37745f;color:var(--mint);border-radius:999px;padding:5px 10px;font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.metric{font-size:28px;color:var(--mint);font-weight:700}.incident{margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.severity{color:var(--amber);font-weight:700}.severity.high{color:var(--red)}button{border:0;border-radius:8px;padding:9px 12px;background:var(--mint);color:#092019;font-weight:700;cursor:pointer}input,select{padding:9px;border:1px solid var(--line);border-radius:7px;background:#0b1220;color:#e7eef8}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a101b;border:1px solid var(--line);padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.note{border-left:3px solid var(--amber);padding:10px 14px;background:#201d17;color:#f8e1b7;margin:18px 0}#status{min-height:24px;color:var(--mint)}
</style></head>
<body><header><div><h1>SentinelMesh</h1><div class="muted">Defensive network investigation lab</div></div><div class="badge">SYNTHETIC DATA ? LOOPBACK ONLY</div></header>
<div class="note">Rule scores are triage signals, not proof of malicious activity. No real network action is available in this demo.</div>
<div class="toolbar"><button id="analyze">Analyze bundled sample</button><span id="status" role="status"></span></div>
<section id="metrics" class="metrics"></section><h2>Investigations</h2><section id="incidents"></section><h2>Recent flow evidence</h2><div class="card"><table><thead><tr><th>Flow</th><th>Source</th><th>Destination</th><th>Protocol</th><th>Bytes</th></tr></thead><tbody id="flows"></tbody></table></div>
<script>
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
async function api(path,opts){const r=await fetch(path,opts);const v=await r.json();if(!r.ok)throw Error(v.error||r.statusText);return v}
async function refresh(){try{const [s,inc,flows]=await Promise.all([api('/api/summary'),api('/api/incidents'),api('/api/flows')]);
const metrics=document.querySelector('#metrics');metrics.replaceChildren();[['Flows',s.flow_count],['Findings',s.finding_count],['Incidents',s.incident_count],['Reports',s.report_count],['Approved simulations',s.approval_count]].forEach(([k,v])=>{const c=el('article','card');c.append(el('div','muted',k),el('div','metric',String(v)));metrics.append(c)});
const wrap=document.querySelector('#incidents');wrap.replaceChildren();inc.forEach(item=>{const c=el('article','card incident'),head=el('div','row'),left=el('div');head.append(left);left.append(el('strong','',item.incident_id+' ? '+item.host),el('div','muted',item.summary));head.append(el('span','severity '+item.severity,item.severity.toUpperCase()));c.append(head,el('p','muted','Linked flow IDs: '+item.evidence_ids.join(', ')));
const actions=el('div','toolbar'),invest=el('button','',"Generate evidence report");invest.onclick=async()=>{try{const rep=await api('/api/incidents/'+encodeURIComponent(item.incident_id)+'/investigate',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const p=el('pre','',JSON.stringify(rep,null,2));c.append(p);await refresh()}catch(e){alert(e.message)}};
const name=el('input');name.placeholder='Analyst name';const sel=el('select');[['mark_for_review','Mark for review (simulated)'],['simulate_host_isolation','Host isolation (simulated only)']].forEach(([v,l])=>{const o=el('option','',l);o.value=v;sel.append(o)});
const approve=el('button','',"Approve simulation");approve.onclick=async()=>{try{await api('/api/incidents/'+encodeURIComponent(item.incident_id)+'/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:sel.value,approved_by:name.value})});document.querySelector('#status').textContent='Recorded a simulation; no network was changed.';await refresh()}catch(e){document.querySelector('#status').textContent=e.message}};
actions.append(invest,name,sel,approve);c.append(actions);wrap.append(c)});
const tbody=document.querySelector('#flows');tbody.replaceChildren();flows.slice(0,30).forEach(f=>{const tr=el('tr');[f.flow_id,f.src_ip+':'+f.src_port,f.dst_ip+':'+f.dst_port,f.protocol,f.bytes_sent.toLocaleString()].forEach(x=>tr.append(el('td','',String(x))));tbody.append(tr)});
}catch(e){document.querySelector('#status').textContent=e.message}}
document.querySelector('#analyze').onclick=async()=>{try{const flows=await fetch('/sample').then(r=>r.json());await api('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(flows)});document.querySelector('#status').textContent='Sample analyzed.';refresh()}catch(e){document.querySelector('#status').textContent=e.message}};
refresh();
</script></body></html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Format check
        run: python -m ruff format --check src tests scripts
      - name: Type check
        run: python -m mypy src/sentinelmesh
      - name: Tests
        run: python -m pytest -q --cov=sentinelmesh --cov-report=term-missing
      - name: Core coverage gate
        run: python -m pytest -q --cov=sentinelmesh.core.models --cov=sentinelmesh.detection.rules --cov=sentinelmesh.correlation.incidents --cov=sentinelmesh.storage.sqlite --cov=sentinelmesh.ingest.flows --cov-fail-under=85
      - name: Generate synthetic smoke input
        run: python scripts/generate_sample_data.py
      - name: CLI smoke test
        run: sentinelmesh analyze

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build --tag sentinelmesh:ci .
